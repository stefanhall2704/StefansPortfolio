# Same as the stock nginx:alpine config, plus OpenTelemetry (module) and a trace id in the access log.
load_module modules/ngx_otel_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # kubelet probes hit / every few seconds; they are not traced and get no trace id
    map $http_user_agent $portfolio_trace {
        default       on;
        ~^kube-probe  off;
    }
    map $portfolio_trace $portfolio_trace_id {
        default  "";
        on       $otel_trace_id;
    }

    # trace_id= lets Grafana jump from an access-log line to the request's trace (empty when not traced)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" trace_id=$portfolio_trace_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
